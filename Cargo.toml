[workspace]
resolver = "2"
members = [
    "crates/nbs-core",
    "crates/nbs-audio",
    "crates/nbs-io",
    "crates/nbs-editor",
    "crates/nbs-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
authors = ["nbs-rust contributors"]

[workspace.dependencies]
nbs-core = { path = "crates/nbs-core" }
nbs-audio = { path = "crates/nbs-audio" }
nbs-io = { path = "crates/nbs-io" }
nbs-editor = { path = "crates/nbs-editor" }
egui = "0.31"
# 默认用 glow（OpenGL）后端：依赖少、兼容性最好；
# 想切 wgpu 只需把 features 改成 ["wgpu", "default_fonts"]。
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lewton = "0.10"
cpal = "0.15"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
