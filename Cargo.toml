[workspace]
resolver = "2"
members = [
    "crates/nbs-core",
    "crates/nbs-audio",
    "crates/nbs-io",
    "crates/nbs-editor",
    "crates/nbs-control",
    "crates/nbs-mcp",
    "crates/nbs-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.88 是 rmcp 3.x 的 rust-version；本仓库其余 crate 本身还跑得在更低版本上，
# 抬这一档只为了让 MCP 桥接进同一个 workspace 编译。
rust-version = "1.88"
license = "AGPL-3.0-only"
authors = ["nbs-rust contributors"]

[workspace.dependencies]
nbs-core = { path = "crates/nbs-core" }
nbs-audio = { path = "crates/nbs-audio" }
nbs-io = { path = "crates/nbs-io" }
nbs-editor = { path = "crates/nbs-editor" }
nbs-control = { path = "crates/nbs-control" }
nbs-mcp = { path = "crates/nbs-mcp" }
egui = "0.31"
# 默认用 glow（OpenGL）后端：依赖少、兼容性最好；
# 想切 wgpu 只需把 features 改成 ["wgpu", "default_fonts"]。
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lewton = "0.10"
# 参考音频的解码后端（crates/nbs-audio/src/reference.rs）：原版只放 Ogg Vorbis，端口
# 另外要 mp3 / flac / 各种位深的 wav 和 aiff，所以引纯 Rust 的 symphonia。只开用得到的：
# pcm 是 wav/aiff 里的内部编码，mpa 含 MP1/MP2/MP3；容器只带 riff 和 flac，ogg 仍走 lewton，
# 元数据解析（id3/ape）和 mkv 都不开。
symphonia = { version = "0.6.1", default-features = false, features = [
    "pcm",
    "wav",
    "aiff",
    "flac",
    "mpa",
] }
cpal = "0.18"
midly = "0.5.3"
rustysynth = "1.3.8"
flate2 = "1"
crc32fast = "1"
# jpeg 是「导入背景图片」要的（原版过滤器 *.png;*.jpg;*.jpeg），其余解码路径只用 png。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parking_lot = "0.12"
# 歌曲标签槽位表（crates/nbs-editor/src/tabs.rs）。与 eframe→glow 那条依赖同版本，
# Cargo.lock 里已有 1.1.1，离线可编。
slotmap = "1.1.1"
# 与 eframe 自己那条依赖同版本同特性，共用一份编译产物；nbs-app 里只在 Windows 目标下引用。
winapi = { version = "0.3.9", features = ["winuser"] }
# MCP 桥接（crates/nbs-mcp）专用：编辑器那侧一行都不引。
# server 特性自带 schemars + transport-async-rw；stdio 要显式加 transport-io。
rmcp = { version = "3", default-features = false, features = [
    "base64",
    "macros",
    "server",
    "transport-io",
] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
schemars = "1"
# 外部生态接入（两条新导出样式）。许可：nbs-fractal 是 AGPL-3.0-or-later，
# 本仓 AGPL-3.0-only 的接收方可取 3.0，方向合规；rsnbs / litematica 是 MIT OR Apache-2.0。
# nbs-fractal 0.1.3 起才带 20 t/s 那两档（linear 的 Scale1、compact 的 halves），别往下降版本。
nbs-fractal = "0.1.3"
rsnbs = "0.1.12"
litematica = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
